<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gridwork — dashboards from any data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#EDEEE9; --surface:#FFFFFF; --surface-2:#E4E5DE; --surface-3:#DBDCD3;
  --ink:#14171C; --ink-soft:#4B505A; --ink-faint:#767C86;
  --border:rgba(20,23,28,0.14); --grid-line:rgba(20,23,28,0.07);
  --brass:#9C6B1E; --brass-strong:#7E5717; --brass-ink:#14171C;
  --teal:#1F5C56; --coral:#A5402F;
  --danger:#A5402F; --danger-bg:rgba(165,64,47,0.1);
  --ok:#3C7A5B; --warn:#9C6B1E; --warn-bg:rgba(156,107,30,0.1);
  --ok-bg:rgba(60,122,91,0.1);
  --radius-card:10px; --radius-control:6px; --radius-pill:999px;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-body:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --font-mono:'IBM Plex Mono',SFMono-Regular,Consolas,'Liberation Mono',monospace;
  --shadow-pop:0 8px 24px rgba(20,23,28,0.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181D; --surface:#1C2028; --surface-2:#232732; --surface-3:#2B303B;
    --ink:#ECEDE8; --ink-soft:#AFB4BD; --ink-faint:#7C8390;
    --border:rgba(236,237,232,0.14); --grid-line:rgba(236,237,232,0.08);
    --brass:#D9A54A; --brass-strong:#E7BC70; --brass-ink:#14171C;
    --teal:#4FA69B; --coral:#D9695A;
    --danger:#D9695A; --danger-bg:rgba(217,105,90,0.14);
    --ok:#5FBF8F; --warn:#D9A54A; --warn-bg:rgba(217,165,74,0.14);
    --ok-bg:rgba(95,191,143,0.14);
    --shadow-pop:0 8px 28px rgba(0,0,0,0.45);
  }
}
:root[data-theme="dark"]{
  --bg:#15181D; --surface:#1C2028; --surface-2:#232732; --surface-3:#2B303B;
  --ink:#ECEDE8; --ink-soft:#AFB4BD; --ink-faint:#7C8390;
  --border:rgba(236,237,232,0.14); --grid-line:rgba(236,237,232,0.08);
  --brass:#D9A54A; --brass-strong:#E7BC70; --brass-ink:#14171C;
  --teal:#4FA69B; --coral:#D9695A;
  --danger:#D9695A; --danger-bg:rgba(217,105,90,0.14);
  --ok:#5FBF8F; --warn:#D9A54A; --warn-bg:rgba(217,165,74,0.14);
  --ok-bg:rgba(95,191,143,0.14);
  --shadow-pop:0 8px 28px rgba(0,0,0,0.45);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased;}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--brass); color:var(--brass-ink);}
h1,h2,h3{font-family:var(--font-display); font-weight:600; margin:0; letter-spacing:-0.01em;}
.num, .mono{font-family:var(--font-mono);}

#setup-banner{display:none; background:var(--warn-bg); color:var(--ink); border-bottom:1px solid var(--border); padding:10px 18px; font-size:13px; align-items:center; gap:10px; flex-wrap:wrap;}
#setup-banner.show{display:flex;}
#setup-banner strong{color:var(--warn-strong,var(--brass-strong));}
#setup-banner code{background:var(--surface); padding:1px 6px; border-radius:4px; font-family:var(--font-mono); font-size:12px;}

#app{display:flex; min-height:100vh; min-height:100dvh;}
#sidebar{width:248px; flex:none; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; height:100vh; height:100dvh; position:sticky; top:0; transition:transform .22s ease, width .2s ease;}
.brand{padding:20px 18px 14px; border-bottom:1px solid var(--border); overflow:hidden;}
.brand-mark{display:flex; align-items:baseline; gap:8px;}
.brand-mark .glyph{width:9px;height:9px;background:var(--brass);display:inline-block;transform:rotate(45deg); flex:none;}
.brand h1{font-size:20px; white-space:nowrap;}
.brand p{margin:4px 0 0; color:var(--ink-faint); font-size:12px; white-space:nowrap;}
.nav-section{padding:14px 12px 6px;}
.nav-section-head{display:flex; align-items:center; justify-content:space-between; padding:2px 6px 8px; color:var(--ink-faint); font-size:12px;}
.nav-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1px;}
.nav-item{display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:8px 9px; border-radius:var(--radius-control); border:none; background:transparent; color:var(--ink-soft); cursor:pointer; font-size:13.5px; min-height:38px; position:relative; transition:background-color .14s ease, color .14s ease;}
.nav-item:hover{background:var(--surface-2); color:var(--ink);}
.nav-item.active{background:var(--surface-2); color:var(--ink); font-weight:600;}
.nav-item.active::before{content:''; position:absolute; left:-12px; top:6px; bottom:6px; width:3px; border-radius:0 3px 3px 0; background:var(--brass);}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint); flex:none; transition:background-color .14s ease;}
.nav-item.active .dot{background:var(--brass);}
.nav-item .name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;}
.nav-item .count{color:var(--ink-faint); font-size:11.5px; font-family:var(--font-mono);}
.nav-add{margin:6px 3px 0; padding:8px 9px; border-radius:var(--radius-control); border:1px dashed var(--border); background:transparent; color:var(--ink-soft); cursor:pointer; font-size:13px; text-align:left; min-height:38px; transition:border-color .14s ease, color .14s ease;}
.nav-add:hover{border-color:var(--brass); color:var(--brass);}
#sidebar-foot{margin-top:auto; padding:12px 16px 16px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:8px;}
.sync-state{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-faint); white-space:nowrap; overflow:hidden;}
.sync-state .led{width:6px;height:6px;border-radius:50%; flex:none; transition:background-color .2s ease;}
.led.on{background:var(--ok);} .led.off{background:var(--warn);}
.theme-btn{border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); border-radius:var(--radius-control); padding:6px 9px; cursor:pointer; font-size:12px; flex:none; transition:border-color .14s ease, color .14s ease;}
.theme-btn:hover{border-color:var(--brass); color:var(--brass);}
#scrim{display:none; position:fixed; inset:0; background:rgba(10,11,13,0.4); z-index:30; transition:opacity .2s ease;}

/* ============ NAV SUBMENUS (dropdown per section) ============ */
.nav-item-row{display:flex; align-items:stretch; gap:1px;}
.nav-item-row .nav-item{flex:1;}
.nav-caret{flex:none; width:28px; min-height:38px; border:none; background:transparent; color:var(--ink-faint); cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:var(--radius-control); transition:transform .18s ease, background-color .14s ease, color .14s ease;}
.nav-caret:hover{background:var(--surface-2); color:var(--ink);}
.nav-caret.open{transform:rotate(90deg);}
.nav-submenu{list-style:none; margin:2px 0 4px; padding:0 0 0 17px; display:flex; flex-direction:column; gap:1px; overflow:hidden; max-height:0; transition:max-height .22s ease;}
.nav-submenu.open{max-height:600px;}
.nav-submenu li{border-left:1px solid var(--border); }
.nav-submenu .nav-item{font-size:12.5px; min-height:32px; padding:6px 9px; color:var(--ink-faint);}
.nav-submenu .nav-item:hover{color:var(--ink);}
.nav-submenu .nav-item.active{color:var(--brass-strong); background:transparent; font-weight:600;}
.nav-submenu .nav-item .dot{width:4px; height:4px;}
.nav-submenu-empty{padding:6px 9px; font-size:12px; color:var(--ink-faint); font-style:italic;}
.nav-submenu-more{padding:5px 9px; font-size:11.5px; color:var(--ink-faint); background:none; border:none; cursor:pointer; text-align:left; width:100%;}
.nav-submenu-more:hover{color:var(--brass);}

/* ============ SIDEBAR COLLAPSE (RAIL MODE, DESKTOP) ============ */
@media (min-width:861px){
  #sidebar.collapsed{width:64px;}
  #sidebar.collapsed .brand-text,
  #sidebar.collapsed .nav-item .name,
  #sidebar.collapsed .nav-item .count,
  #sidebar.collapsed .nav-caret,
  #sidebar.collapsed .nav-submenu,
  #sidebar.collapsed .nav-add span,
  #sidebar.collapsed #dashboard-subnav .nav-section-head,
  #sidebar.collapsed .sync-state span:last-child{display:none !important;}
  #sidebar.collapsed .brand{padding:20px 0 14px; display:flex; justify-content:center;}
  #sidebar.collapsed .brand-mark{gap:0;}
  #sidebar.collapsed .nav-section{padding:10px 8px 6px;}
  #sidebar.collapsed .nav-item, #sidebar.collapsed .nav-item-row{justify-content:center;}
  #sidebar.collapsed .nav-item{justify-content:center; padding:8px;}
  #sidebar.collapsed .nav-add{text-align:center; padding:8px;}
  #sidebar.collapsed #sidebar-foot{flex-direction:column; padding:12px 8px 16px;}
  #sidebar.collapsed .theme-btn{width:100%;}
}

/* ============ SETTINGS PAGE ============ */
.settings-grid{display:flex; flex-direction:column; gap:16px; max-width:720px;}
.settings-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card); padding:18px 20px;}
.settings-card h3{font-size:14.5px; margin-bottom:4px;}
.settings-card .settings-desc{color:var(--ink-faint); font-size:12.5px; margin:0 0 14px; max-width:56ch;}
.settings-row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:10px 0; border-top:1px solid var(--grid-line);}
.settings-row:first-of-type{border-top:none; padding-top:0;}
.settings-row .label{font-size:13px;}
.settings-row .value{font-size:12.5px; color:var(--ink-faint); font-family:var(--font-mono); text-align:right; word-break:break-all; max-width:60%;}
.settings-danger{border-color:var(--danger);}
.settings-locked-note{display:flex; align-items:center; gap:8px; background:var(--warn-bg); color:var(--ink); border-radius:var(--radius-control); padding:10px 12px; font-size:12.5px; margin-bottom:14px;}

/* ============ ANIMATIONS ============ */
@keyframes dropdown-in{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);}}
@keyframes modal-pop-in{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes backdrop-fade-in{from{opacity:0;} to{opacity:1;}}
@keyframes canvas-fade-in{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@keyframes sidebar-fade-in{from{opacity:0;} to{opacity:1;}}
#canvas.page-enter{animation:canvas-fade-in .22s ease both;}
.modal-backdrop{animation:backdrop-fade-in .16s ease both;}
.modal-backdrop .modal{animation:modal-pop-in .2s cubic-bezier(.2,.8,.3,1) both;}
.profile-dropdown.open{animation:dropdown-in .15s ease both;}
.chart-card, .team-row, .gsearch-item{transition:background-color .14s ease;}
.btn{transition:background-color .14s ease, border-color .14s ease, transform .1s ease, opacity .14s ease;}
.btn:active{transform:translateY(1px);}
#toast{transition:opacity .2s ease, transform .2s ease;}
#main{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{display:flex; align-items:center; gap:10px; padding:14px 22px; border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; z-index:5; flex-wrap:wrap;}
#hamburger{display:none; border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-control); width:38px; height:38px; cursor:pointer; flex:none; color:var(--ink);}
.icon-btn{border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-control); width:38px; height:38px; cursor:pointer; flex:none; color:var(--ink); display:inline-flex; align-items:center; justify-content:center; font-size:15px; transition:border-color .15s ease, background-color .15s ease, transform .12s ease, opacity .15s ease;}
.icon-btn:hover{border-color:var(--ink-faint);}
.icon-btn:active{transform:scale(.93);}
.icon-btn:disabled{opacity:.35; cursor:default; pointer-events:none;}
.nav-hist-group{display:flex; align-items:center; gap:6px; flex:none;}

/* ============ COLLAPSE / DESKTOP SIDEBAR TOGGLE ============ */
#sidebar-collapse-btn{display:none; flex:none;}
@media (min-width:861px){
  #sidebar-collapse-btn{display:inline-flex;}
}

/* ============ GLOBAL SEARCH ============ */
.gsearch{position:relative; flex:1 1 auto; min-width:120px; max-width:420px;}
.gsearch-input-wrap{display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid transparent; border-radius:var(--radius-pill); padding:0 12px; height:38px; transition:border-color .15s ease, background-color .15s ease;}
.gsearch-input-wrap:focus-within{border-color:var(--brass); background:var(--surface);}
.gsearch-input-wrap .gicon{color:var(--ink-faint); font-size:13px; flex:none;}
.gsearch-input-wrap input{border:none; background:transparent; font-size:13px; min-height:34px; padding:0; width:100%;}
.gsearch-kbd{flex:none; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); border:1px solid var(--border); border-radius:4px; padding:1px 5px; background:var(--surface);}
.gsearch-results{position:absolute; left:0; right:0; top:46px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-control); box-shadow:var(--shadow-pop); z-index:50; max-height:60vh; overflow:auto; display:none; animation:dropdown-in .14s ease;}
.gsearch-results.open{display:block;}
.gsearch-group-label{padding:8px 12px 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint);}
.gsearch-item{display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:8px 12px; background:none; border:none; cursor:pointer; color:var(--ink); font-size:13px;}
.gsearch-item:hover, .gsearch-item.hl{background:var(--surface-2);}
.gsearch-item .gtype{margin-left:auto; font-size:10.5px; color:var(--ink-faint); font-family:var(--font-mono);}
.gsearch-empty{padding:16px 12px; color:var(--ink-faint); font-size:12.5px; text-align:center;}
@media (max-width:640px){ .gsearch{display:none;} }
.profile-menu-wrap{position:relative; flex:none; margin-left:4px;}
.profile-btn{border-radius:50%; background:var(--brass); color:var(--brass-ink); border-color:var(--brass); font-weight:700; font-size:13px;}
.profile-btn:hover{background:var(--brass-strong); border-color:var(--brass-strong);}
.profile-dropdown{display:none; position:absolute; right:0; top:46px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-control); box-shadow:var(--shadow-pop); min-width:220px; z-index:20; overflow:hidden;}
.profile-dropdown.open{display:block;}
.profile-dropdown-head{padding:12px 14px; border-bottom:1px solid var(--border);}
.profile-name{font-weight:600; font-size:13.5px; margin-bottom:2px;}
.profile-email-sub{color:var(--ink-faint); font-size:11.5px; margin-bottom:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.profile-dropdown button{display:block; width:100%; text-align:left; padding:10px 14px; background:none; border:none; font-size:13px; color:var(--ink); cursor:pointer;}
.profile-dropdown button:hover{background:var(--surface-2);}
#topbar h2{font-size:19px; flex:none;}
.breadcrumb{font-size:11.5px; color:var(--ink-faint); margin-bottom:2px; display:flex; align-items:center; gap:5px; min-height:14px;}
.breadcrumb button{background:none; border:none; padding:0; font-size:11.5px; color:var(--ink-faint); cursor:pointer; font-family:var(--font-mono);}
.breadcrumb button:hover{color:var(--brass); text-decoration:underline;}
.breadcrumb span.sep{color:var(--border);}
.breadcrumb span.current{color:var(--ink-soft); font-family:var(--font-mono);}
#topbar .sub{color:var(--ink-faint); font-size:12.5px;}
.topbar-spacer{flex:1;}
.topbar-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
#canvas{flex:1; padding:22px; overflow:auto; background-image:linear-gradient(var(--grid-line) 1px, transparent 1px),linear-gradient(90deg, var(--grid-line) 1px, transparent 1px); background-size:28px 28px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:var(--radius-control); border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:13px; font-weight:500; padding:9px 14px; cursor:pointer; min-height:38px; white-space:nowrap;}
.btn:hover{border-color:var(--ink-faint);}
.btn:disabled{opacity:.5; cursor:default;}
.btn-primary{background:var(--brass); border-color:var(--brass); color:var(--brass-ink); font-weight:600;}
.btn-primary:hover{background:var(--brass-strong); border-color:var(--brass-strong);}
.btn-ghost{background:transparent; border-color:transparent; color:var(--ink-soft);}
.btn-ghost:hover{background:var(--surface-2); color:var(--ink);}
.btn-danger{color:var(--danger); border-color:var(--border);}
.btn-danger:hover{background:var(--danger-bg); border-color:var(--danger);}
.btn-sm{padding:6px 10px; min-height:32px; font-size:12.5px;}
.btn-icon{padding:8px; width:38px;}
input[type=text], input[type=number], input[type=search], textarea, select{font-family:inherit; font-size:13.5px; color:var(--ink); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-control); padding:9px 11px; min-height:38px; width:100%;}
textarea{min-height:120px; font-family:var(--font-mono); font-size:12.5px; resize:vertical;}
label{display:block; font-size:12px; color:var(--ink-soft); margin:0 0 5px; font-weight:500;}
.field{margin-bottom:14px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
select{appearance:none; background-image:linear-gradient(45deg, transparent 50%, var(--ink-faint) 50%),linear-gradient(135deg, var(--ink-faint) 50%, transparent 50%); background-position:calc(100% - 16px) center, calc(100% - 11px) center; background-size:5px 5px, 5px 5px; background-repeat:no-repeat; padding-right:30px;}
.tag{display:inline-flex; align-items:center; padding:2px 9px; border-radius:var(--radius-pill); font-size:11px; font-family:var(--font-mono); border:1px solid var(--border); color:var(--ink-soft);}
.tag.t-number{color:var(--teal); border-color:var(--teal);}
.tag.t-date{color:var(--brass-strong); border-color:var(--brass);}
.tag.t-string{color:var(--ink-faint);}
.tag.status-danger{color:var(--danger); border-color:var(--danger); background:var(--danger-bg);}
.tag.status-warn{color:var(--warn); border-color:var(--warn); background:var(--warn-bg);}
.tag.status-ok{color:var(--ok); border-color:var(--ok); background:var(--ok-bg);}
.tag.status-neutral{color:var(--ink-faint);}
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:16px;}
.tab{padding:9px 4px; margin-right:18px; background:none; border:none; border-bottom:2px solid transparent; color:var(--ink-faint); font-size:13.5px; cursor:pointer; font-weight:500;}
.tab.active{color:var(--ink); border-color:var(--brass);}
.dash-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px; align-items:start;}
.chart-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card); padding:16px; display:flex; flex-direction:column; min-height:280px;}
.chart-card.card-kpi{min-height:150px; justify-content:center;}
.chart-card.card-table{min-height:auto;}
.card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:10px;}
.card-head h3{font-size:14.5px; font-weight:600; font-family:var(--font-body);}
.card-menu-wrap{position:relative;}
.card-menu{position:absolute; right:0; top:32px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-control); box-shadow:var(--shadow-pop); min-width:150px; z-index:8; overflow:hidden; display:none;}
.card-menu.open{display:block;}
.card-menu button{display:block; width:100%; text-align:left; padding:9px 12px; background:none; border:none; font-size:13px; color:var(--ink); cursor:pointer;}
.card-menu button:hover{background:var(--surface-2);}
.chart-body{flex:1; min-height:0; position:relative;}
.chart-body canvas{cursor:pointer;}
.kpi-value{font-family:var(--font-display); font-size:40px; font-weight:600; line-height:1;}
.kpi-label{color:var(--ink-faint); font-size:12.5px; margin-top:6px;}
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-control);}
table.data-table{border-collapse:collapse; width:100%; font-size:12.5px;}
table.data-table th{position:sticky; top:0; background:var(--surface-2); text-align:left; padding:8px 10px; font-weight:600; border-bottom:1px solid var(--border); white-space:nowrap;}
table.data-table td{padding:7px 10px; border-bottom:1px solid var(--grid-line); font-family:var(--font-mono); white-space:nowrap;}
table.data-table tr:last-child td{border-bottom:none;}
table.module-table tbody tr{transition:background .12s ease;}
table.module-table tbody tr:hover{background:var(--surface-2);}
table.module-table td, table.module-table th{white-space:normal;}
table.module-table td:first-child, table.module-table th:first-child{padding-left:13px;}
table.data-table tbody tr{transition:background-color .12s ease;}
table.data-table tbody tr:hover{background:var(--surface-2);}
table.data-table td.status-edge{box-shadow:inset 4px 0 0 0 var(--edge-color, transparent);}
.hero{max-width:640px; margin:6vh auto; text-align:left;}
.hero .kicker{color:var(--brass-strong); font-family:var(--font-mono); font-size:12.5px; margin-bottom:10px;}
.hero h2{font-size:38px; line-height:1.08; margin-bottom:14px;}
.hero p{color:var(--ink-soft); font-size:15px; max-width:52ch; margin-bottom:22px;}
.hero-actions{display:flex; gap:10px; flex-wrap:wrap;}
.empty-block{border:1px dashed var(--border); border-radius:var(--radius-card); padding:40px 24px; text-align:center; color:var(--ink-faint); line-height:1.6;}
.section-intro{color:var(--ink-soft); font-size:13px; line-height:1.5; max-width:70ch; margin:-6px 0 18px;}
.skeleton-row{height:38px; border-radius:6px; background:linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 37%, var(--surface-2) 63%); background-size:400% 100%; animation:skeleton-shimmer 1.4s ease infinite; margin-bottom:8px;}
@keyframes skeleton-shimmer{0%{background-position:100% 50%;} 100%{background-position:0% 50%;}}
@media (prefers-reduced-motion: reduce){ .skeleton-row{animation:none; opacity:.6;} }
.modal-backdrop{position:fixed; inset:0; background:rgba(10,11,13,0.46); display:none; align-items:flex-start; justify-content:center; z-index:40; padding:5vh 16px 5vh;}
.modal-backdrop.open{display:flex;}
.modal{background:var(--surface); border-radius:var(--radius-card); border:1px solid var(--border); width:100%; max-width:620px; max-height:90vh; display:flex; flex-direction:column; box-shadow:var(--shadow-pop);}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); flex:none;}
.modal-head h3{font-size:17px;}
.modal-body{padding:20px; overflow:auto;}
.modal-foot{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 20px; border-top:1px solid var(--border); flex:none;}

.preview-note{font-size:12px; color:var(--ink-faint); margin-bottom:8px;}
.grid-toolbar{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;}

table.manual-grid th, table.manual-grid td{border:1px solid var(--border); padding:0;}

.row-x{width:30px; text-align:center; color:var(--ink-faint); cursor:pointer; font-size:14px;}
.ask-bar{display:flex; gap:8px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-pill); padding:6px 6px 6px 14px; flex:1; min-width:260px; max-width:640px;}
.ask-bar .spark{color:var(--brass); flex:none; font-size:15px;}
.ask-bar input{border:none; min-height:30px; padding:4px 0; background:transparent;}

/* ============ FREE LAYOUT CANVAS ============ */
.dash-canvas{position:relative; min-height:200px;}
.chart-card.free{position:absolute; margin:0; overflow:hidden;}
.resize-handle{position:absolute; width:14px; height:14px; z-index:5; touch-action:none;}
.resize-handle.br{right:-5px; bottom:-5px; cursor:nwse-resize;}
.resize-handle.bl{left:-5px; bottom:-5px; cursor:nesw-resize;}
.resize-handle.tr{right:-5px; top:-5px; cursor:nesw-resize;}
.resize-handle.tl{left:-5px; top:-5px; cursor:nwse-resize;}

function uid(){

  return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);

function esc(s){
  s = (s===undefined||s===null) ? '' : String(s);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ================= TYPE DETECTION ================= */
function detectType(values){
  var num=0, date=0, total=0;
  for(var i=0;i<values.length;i++){
    var v = values[i];
    if(v===undefined||v===null||v==='') continue;
    total++;
    var n = typeof v==='number' ? v : parseFloat(v);
    if(!isNaN(n) && isFinite(n) && String(v).trim()!=='' && /^-?[\d.,]+%?$/.test(String(v).trim())){ num++; continue; }
    var d = Date.parse(v);
    if(!isNaN(d) && isNaN(n) && /[-\/]/.test(String(v))) { date++; }
  }
  if(total===0) return 'string';
  if(num/total > 0.75) return 'number';
  if(date/total > 0.75) return 'date';
  return 'string';
}
function inferColumns(rows, headers){
  return headers.map(function(h){
    var vals = rows.slice(0,300).map(function(r){ return r[h]; });
    return {name:h, type:detectType(vals)};
  });
}
function coerceNumber(v){
  if(v===undefined||v===null||v==='') return NaN;
  if(typeof v==='number') return v;
  var n = parseFloat(String(v).replace(/,/g,''));
  return n;
}
function monthBin(v){
  var d = new Date(v);
  if(isNaN(d)) return String(v);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

/* ================= AUTH ================= */
var Auth = {
  user: null, profile: null,

  init: async function(){
    if(!sb) return;
    var res = await sb.auth.getSession();
    var session = res && res.data && res.data.session;
    if(session){ this.user = session.user; await this.loadProfile(); }
  },
  loadProfile: async function(){
    if(!this.user || !sb) return;
    try{
      var res = await sb.from('profiles').select('*').eq('id', this.user.id).single();
      if(!res.error){ this.profile = res.data; }
    }catch(e){ /* profile may not exist yet on very first sign-up tick */ }
  },
  isEditor: function(){ return !!(this.profile && this.profile.role==='editor'); },
  displayName: function(){
    if(this.profile && this.profile.full_name) return this.profile.full_name;
    return this.user ? this.user.email : '';
  },
  signUp: async function(email, password, fullName){
    var res = await sb.auth.signUp({ email: email, password: password, options: { data: { full_name: fullName } } });
    if(res.error) throw res.error;
    return res.data;
  },
  signIn: async function(email, password){
    var res = await sb.auth.signInWithPassword({ email: email, password: password });
    if(res.error) throw res.error;
    return res.data;
  },
  signOut: async function(){
    await sb.auth.signOut();
    location.reload();
  }
};

/* ================= ACTIVITY LOG (Audit Trail) ================= */
function logActivity(action, entityType, label){
  if(!sb || !Auth.user) return; // fire-and-forget, never blocks the real action
  sb.from('activity_log').insert({
    user_id: Auth.user.id,
    user_email: Auth.user.email,

/* ================= STORE (Supabase, localStorage fallback) ================= */
var Store = {
  mode: 'local',
  datasets: {}, dashboards: {}, cards: {},
  local: {datasets:{}, dashboards:{}, cards:{}},

  loadLocal: function(){
    try{ var raw = localStorage.getItem('gridwork-store'); if(raw){ this.local = JSON.parse(raw); } }catch(e){}
    if(!this.local.datasets) this.local.datasets = {};
    if(!this.local.dashboards) this.local.dashboards = {};
    if(!this.local.cards) this.local.cards = {};
  },
  saveLocal: function(){ try{ localStorage.setItem('gridwork-store', JSON.stringify(this.local)); }catch(e){} },

  init: async function(){
    this.loadLocal();
    if(sb){
      this.mode = 'db';
      await this.refreshAll();
      this.subscribeAll();
    } else {
      this.mode = 'local';
      this.datasets = this.local.datasets;
      this.dashboards = this.local.dashboards;
      this.cards = this.local.cards;
    }
    updateSyncBadge();
  },

  refreshAll: async function(){
    if(!sb) return;
    var self = this;
    // Coalesce overlapping calls: if a refresh is already in flight, queue at
    // most one more instead of firing several concurrent fetches that can
    // finish out of order and clobber each other.
    if(this._refreshing){ this._refreshQueued = true; return this._refreshing; }
    this._refreshing = (async function(){
      try{
        var dsRes = await sb.from('datasets').select('*').order('created_at', {ascending:false});
        if(dsRes.error) throw dsRes.error;
        var dashRes = await sb.from('dashboards').select('*').order('created_at', {ascending:false});
        if(dashRes.error) throw dashRes.error;
        var cardRes = await sb.from('cards').select('*');
        if(cardRes.error) throw cardRes.error;
        var next = {};
        (dsRes.data||[]).forEach(function(r){ next[r.id] = {id:r.id, name:r.name, columns:r.columns||[], rows:r.rows||[], rowCount:r.row_count||0, truncated:r.truncated, createdAt:new Date(r.created_at).getTime()}; });
        self.datasets = next;
        var nextDash = {};
        (dashRes.data||[]).forEach(function(r){ nextDash[r.id] = {id:r.id, name:r.name, cardIds:r.card_ids||[], createdAt:new Date(r.created_at).getTime()}; });
        self.dashboards = nextDash;
        var nextCards = {};
        (cardRes.data||[]).forEach(function(r){ nextCards[r.id] = {id:r.id, dashboardId:r.dashboard_id, datasetId:r.dataset_id, type:r.type, title:r.title, xField:r.x_field, yField:r.y_field, agg:r.agg, posX:r.pos_x, posY:r.pos_y, width:r.width, height:r.height}; });
        self.cards = nextCards;
      }catch(e){ toast('Could not load data from Supabase — check your setup.', true); }
      finally{
        self._refreshing = null;
        if(self._refreshQueued){ self._refreshQueued = false; await self.refreshAll(); }
      }
    })();
    return this._refreshing;
  },
  subscribeAll: function(){
    var self = this;
    var timer = null;
    function scheduleRefresh(){
      // Debounce: a single dataset upload can trigger several rapid table
      // changes (insert dataset, insert dashboard, insert cards, update
      // dashboard). Wait for the burst to settle, then refresh once.
      clearTimeout(timer);
      timer = setTimeout(function(){ self.refreshAll().then(renderAll); }, 300);
    }
    ['datasets','dashboards','cards'].forEach(function(table){
      sb.channel(table+'-changes').on('postgres_changes', {event:'*', schema:'public', table:table}, scheduleRefresh).subscribe();
    });
  },
  getRows: function(datasetId){
    var ds = this.datasets[datasetId];
    return ds ? (ds.rows||[]) : [];
  },

  saveDataset: async function(name, columns, rows){
    var truncated = rows.length > MAX_ROWS;
    if(truncated) rows = rows.slice(0, MAX_ROWS);
    if(this.mode==='db'){
      var res = await sb.from('datasets').insert({name:name, columns:columns, rows:rows, row_count:rows.length, truncated:truncated}).select().single();
      if(res.error) throw res.error;
      var id = res.data.id;
      this.datasets[id] = {id:id, name:name, columns:columns, rows:rows, rowCount:rows.length, truncated:truncated, createdAt:Date.now()};
      logActivity('created', 'dataset', name);
      return id;
    } else {
      var id2 = uid();
      this.local.datasets[id2] = {id:id2, name:name, columns:columns, rows:rows, rowCount:rows.length, truncated:truncated, createdAt:Date.now()};
      this.datasets = this.local.datasets;
      this.saveLocal();
      return id2;
    }
  },
  deleteDataset: async function(id){
    if(this.mode==='db'){
      try{ await sb.from('datasets').delete().eq('id', id); }catch(e){ toast('Could not delete dataset.', true); }
    } else { delete this.local.datasets[id]; this.saveLocal(); }
  },
  saveDashboard: async function(name, id){
    if(this.mode==='db'){
      if(id){
        await sb.from('dashboards').update({name:name}).eq('id', id);
        logActivity('updated', 'dashboard', name);
        return id;
      }
      var res = await sb.from('dashboards').insert({name:name, card_ids:[]}).select().single();
      if(res.error) throw res.error;
      this.dashboards[res.data.id] = {id:res.data.id, name:name, cardIds:[], createdAt:Date.now()};
      logActivity('created', 'dashboard', name);
      return res.data.id;
    } else {
      id = id || uid();
      var existing = this.local.dashboards[id];
      this.local.dashboards[id] = {id:id, name:name, cardIds: existing?existing.cardIds:[], createdAt: existing?existing.createdAt:Date.now()};
      this.dashboards = this.local.dashboards;
      this.saveLocal();
      return id;
    }
  },
  deleteDashboard: async function(id){
    var cardIds = (this.dashboards[id] && this.dashboards[id].cardIds) || [];
    for(var i=0;i<cardIds.length;i++){ await this.deleteCard(cardIds[i], id, false); }
    if(this.mode==='db'){ try{ await sb.from('dashboards').delete().eq('id', id); }catch(e){} }
    else { delete this.local.dashboards[id]; this.saveLocal(); }
  },
  saveCard: async function(card){
    if(this.mode==='db'){
      var payload = {dashboard_id:card.dashboardId, dataset_id:card.datasetId, type:card.type, title:card.title, x_field:card.xField, y_field:card.yField, agg:card.agg};
      if(card.posX!==undefined) payload.pos_x = card.posX;
      if(card.posY!==undefined) payload.pos_y = card.posY;
      if(card.width!==undefined) payload.width = card.width;
      if(card.height!==undefined) payload.height = card.height;
      var id;
      var wasNew = !card.id;
      if(card.id){
        await sb.from('cards').update(payload).eq('id', card.id);
        id = card.id;
      } else {
        var res = await sb.from('cards').insert(payload).select().single();
        if(res.error) throw res.error;
        id = res.data.id;
      }
      this.cards[id] = Object.assign({}, card, {id:id});
      var dash = this.dashboards[card.dashboardId];
      var ids = dash ? (dash.cardIds||[]).slice() : [];
      if(ids.indexOf(id)===-1){
        ids.push(id);
        await sb.from('dashboards').update({card_ids:ids}).eq('id', card.dashboardId);
        if(this.dashboards[card.dashboardId]) this.dashboards[card.dashboardId].cardIds = ids;
      }
      logActivity(wasNew?'created':'updated', 'chart', card.title);
      return id;
    } else {
      card.id = card.id || uid();
      this.local.cards[card.id] = card;
      this.cards = this.local.cards;
      var dash2 = this.local.dashboards[card.dashboardId];
      if(dash2){
        var ids2 = (dash2.cardIds||[]).slice();
        if(ids2.indexOf(card.id)===-1){ ids2.push(card.id); dash2.cardIds = ids2; }
      }
      this.saveLocal();
      return card.id;
    }
  },
  deleteCard: async function(cardId, dashboardId, updateDash){
    if(updateDash===undefined) updateDash = true;
    if(this.mode==='db'){ try{ await sb.from('cards').delete().eq('id', cardId); }catch(e){} }
    else { delete this.local.cards[cardId]; this.saveLocal(); }
    if(updateDash){
      var dash = this.dashboards[dashboardId];
      if(dash){
        var ids = (dash.cardIds||[]).filter(function(x){ return x!==cardId; });
        if(this.mode==='db'){ try{ await sb.from('dashboards').update({card_ids:ids}).eq('id', dashboardId); }catch(e){} }
        else { this.local.dashboards[dashboardId].cardIds = ids; this.saveLocal(); }
      }
    }
  }
};

/* ================= AGGREGATION ================= */
function aggregate(rows, xField, yField, xType, agg){
  var groups = {}; var order = [];
  rows.forEach(function(r){
    var key = r[xField];
    if(key===undefined||key===null||key==='') key='(empty)';
    if(xType==='date') key = monthBin(key);
    if(!(key in groups)){ groups[key]=[]; order.push(key); }
    groups[key].push(r[yField]);
  });
  var labels = order.slice();
  labels.sort(function(a,b){
    var na = parseFloat(a), nb = parseFloat(b);
    if(!isNaN(na) && !isNaN(nb)) return na-nb;
    return String(a).localeCompare(String(b));
  });
  var data = labels.map(function(l){
    var raw = groups[l];
    if(agg==='count') return raw.length;
    var nums = raw.map(coerceNumber).filter(function(n){ return !isNaN(n); });
    if(nums.length===0) return 0;
    if(agg==='sum') return nums.reduce(function(a,b){return a+b;},0);
    if(agg==='avg') return nums.reduce(function(a,b){return a+b;},0)/nums.length;
    if(agg==='min') return Math.min.apply(null,nums);
    if(agg==='max') return Math.max.apply(null,nums);
    return nums.reduce(function(a,b){return a+b;},0);
  });
  return {labels:labels, data:data};
}
function singleAgg(rows, yField, agg){
  if(agg==='count') return rows.length;
  var nums = rows.map(function(r){ return coerceNumber(r[yField]); }).filter(function(n){ return !isNaN(n); });
  if(nums.length===0) return 0;
  if(agg==='sum') return nums.reduce(function(a,b){return a+b;},0);
  if(agg==='avg') return nums.reduce(function(a,b){return a+b;},0)/nums.length;
  if(agg==='min') return Math.min.apply(null,nums);
  if(agg==='max') return Math.max.apply(null,nums);
  return nums.reduce(function(a,b){return a+b;},0);
}
function skeletonHTML(rows){
  var n = rows || 4;
  var out = '';
  for(var i=0;i<n;i++){ out += '<div class="skeleton-row" style="width:'+(100-i*6)+'%;"></div>'; }
  return out;
}
function setBreadcrumb(parts){
  var el = document.getElementById('breadcrumb');

}
function fmtNum(n){
  if(typeof n!=='number' || isNaN(n)) return String(n);
  if(Math.abs(n) >= 1000) return n.toLocaleString(undefined,{maximumFractionDigits:1});
  return (Math.round(n*100)/100).toString();
}
function autoChartTitle(type, xField, yField, agg, datasetName){
  var aggLabel = {sum:'Sum', avg:'Average', count:'Count', min:'Minimum', max:'Maximum'}[agg] || 'Sum';
  if(type==='kpi') return aggLabel+' of '+(yField||'value');
  if(type==='table') return (datasetName||'Data')+' — table';
  if(type==='scatter') return (yField||'')+' vs '+(xField||'');
  if(type==='pie' || type==='donut') return (yField||'')+' by '+(xField||'');
  return aggLabel+' of '+(yField||'')+' by '+(xField||'');
}

/* ================= CHART RENDERING ================= */
var chartInstances = {};
function destroyChart(cardId){ if(chartInstances[cardId]){ chartInstances[cardId].destroy(); delete chartInstances[cardId]; } }
function renderChartInto(canvas, card, rows, columns){
  var colType = {}; columns.forEach(function(c){ colType[c.name]=c.type; });
  var pal = palette();
  var gridColor = cssVar('--grid-line') || 'rgba(0,0,0,0.07)';
  var textColor = cssVar('--ink-soft') || '#666';

  if(card.type==='pie' || card.type==='donut'){
    var agg1 = aggregate(rows, card.xField, card.yField, colType[card.xField], card.agg||'sum');
    var top = agg1.labels.map(function(l,i){ return {l:l, v:agg1.data[i]}; }).sort(function(a,b){return b.v-a.v;}).slice(0,8);
    chartInstances[card.id] = new Chart(canvas, {type:'pie', data:{labels:top.map(function(t){return t.l;}), datasets:[{data:top.map(function(t){return t.v;}), backgroundColor:pal, borderColor:cssVar('--surface')||'#fff', borderWidth:2}]}, options:{responsive:true, maintainAspectRatio:false, cutout: card.type==='donut' ? '58%' : 0, plugins:{legend:{position:'bottom', labels:{color:textColor, boxWidth:10, font:{family:"IBM Plex Sans", size:11}}}}, onClick:function(evt, elements){ if(elements && elements.length){ openDrilldown(card, top[elements[0].index].l); } }}});
  } else if(card.type==='scatter'){
    var pts = rows.slice(0,1200).map(function(r){ return {x:coerceNumber(r[card.xField]), y:coerceNumber(r[card.yField])}; }).filter(function(p){ return !isNaN(p.x)&&!isNaN(p.y); });
    chartInstances[card.id] = new Chart(canvas, {type:'scatter', data:{datasets:[{label:card.title, data:pts, backgroundColor:pal[0]}]}, options:{responsive:true, maintainAspectRatio:false, scales:{x:{title:{display:true,text:card.xField,color:textColor,font:{family:"IBM Plex Sans"}},ticks:{color:textColor},grid:{color:gridColor}}, y:{title:{display:true,text:card.yField,color:textColor,font:{family:"IBM Plex Sans"}},ticks:{color:textColor},grid:{color:gridColor}}}, plugins:{legend:{display:false}}}});
  } else {
    var agg2 = aggregate(rows, card.xField, card.yField, colType[card.xField], card.agg||'sum');
    var labels = agg2.labels, data = agg2.data;
    if(labels.length > 30){ labels = labels.slice(0,30); data = data.slice(0,30); }
    var isHBar = card.type==='hbar';
    var isArea = card.type==='area';
    var chartJsType = isHBar ? 'bar' : (isArea ? 'line' : card.type);
    var fillColor = pal[0];
    var areaFill = isArea ? fillColor+'33' : 'transparent'; // ~20% opacity fill for area charts
    chartInstances[card.id] = new Chart(canvas, {
      type: chartJsType,
      data:{labels:labels, datasets:[{label:card.title, data:data, backgroundColor: (card.type==='bar'||isHBar)? pal[0] : areaFill, borderColor:pal[0], borderWidth:2, tension:0.25, fill:isArea, pointRadius: (card.type==='line'||isArea)?2:0}]},
      options:{responsive:true, maintainAspectRatio:false, indexAxis: isHBar ? 'y' : 'x',
        scales:{x:{ticks:{color:textColor, maxRotation:50, minRotation:0, font:{family:"IBM Plex Mono", size:10.5}}, grid:{color:gridColor}, beginAtZero:isHBar}, y:{ticks:{color:textColor, font:{family:"IBM Plex Mono", size:10.5}}, grid:{color:gridColor}, beginAtZero:!isHBar}},
        plugins:{legend:{display:false}},
        onClick: function(evt, elements){ if(elements && elements.length){ openDrilldown(card, labels[elements[0].index]); } }
      }
    });
  }
}

function openDrilldown(card, clickedLabel){
  var ds = Store.datasets[card.datasetId];
  if(!ds) return;
  var rows = applyFilters(Store.getRows(card.datasetId), card.dashboardId, card.datasetId);
  var colType = {}; (ds.columns||[]).forEach(function(c){ colType[c.name]=c.type; });
  var isDateX = colType[card.xField]==='date';
  var matched = rows.filter(function(r){
    var key = r[card.xField];
    if(key===undefined || key===null || key==='') key = '(empty)';
    if(isDateX) key = monthBin(key);
    return String(key)===String(clickedLabel);
  });
  var cols = ds.columns||[];
  var sample = matched.slice(0,200);
  var html = '<div class="modal-head"><h3>'+esc(card.xField)+': '+esc(clickedLabel)+'</h3><button class="btn btn-ghost btn-icon" id="m-close">✕</button></div><div class="modal-body">'+
    '<div class="preview-note">'+matched.length+' matching row(s)'+(matched.length>sample.length?' — showing first '+sample.length:'')+'</div>'+
    '<div class="table-wrap" style="max-height:55vh;"><table class="data-table"><thead><tr>'+
    cols.map(function(c){ return '<th>'+esc(c.name)+'</th>'; }).join('')+
    '</tr></thead><tbody>'+
    sample.map(function(r){ return '<tr>'+cols.map(function(c){ return '<td>'+esc(r[c.name])+'</td>'; }).join('')+'</tr>'; }).join('')+
    '</tbody></table></div></div><div class="modal-foot"><span></span><button class="btn" id="drilldown-export">Download these rows as CSV</button></div>';
  openModal(html, function(modal){
    document.getElementById('m-close').onclick = closeModal;
    document.getElementById('drilldown-export').onclick = function(){
      var colNames = cols.map(function(c){return c.name;});
      offerDownload((card.title||'drilldown').replace(/[^a-z0-9-_]+/gi,'_')+'_'+String(clickedLabel).replace(/[^a-z0-9-_]+/gi,'_')+'.csv', toCSV(colNames, matched));
    };
  });
}
function parseCSVText(text, cb){
  Papa.parse(text, {header:true, skipEmptyLines:true, dynamicTyping:false, complete:function(res){ cb(res.meta.fields||[], res.data); }, error:function(){ toast('Could not parse that file.', true); }});
}
function parsePasted(text, cb){
  var delim = text.indexOf('\t')>-1 ? '\t' : ',';
  Papa.parse(text.trim(), {header:true, skipEmptyLines:true, delimiter:delim, complete:function(res){ cb(res.meta.fields||[], res.data); }});
}
function parseExcelFile(file, cb){
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var wb = XLSX.read(e.target.result, {type:'array'});
      var sheetName = wb.SheetNames[0];
      var sheet = wb.Sheets[sheetName];
      var json = XLSX.utils.sheet_to_json(sheet, {defval:''});
      var headers = json.length ? Object.keys(json[0]) : [];
      cb(headers, json, wb.SheetNames);
    }catch(err){ toast('Could not read that Excel file.', true); }
  };
  reader.readAsArrayBuffer(file);
}

/* ================= IN-APP NAVIGATION HISTORY (back / forward) ================= */
var NavHistory = {
  stack: [], index: -1, navigating: false,
  snapshot: function(){
    return { section:state.section, view:state.view, currentDatasetId:state.currentDatasetId, currentDashboardId:state.currentDashboardId };
  },
  sameAsCurrent: function(snap){
    var c = this.stack[this.index];
    if(!c) return false;
    return c.section===snap.section && c.view===snap.view && c.currentDatasetId===snap.currentDatasetId && c.currentDashboardId===snap.currentDashboardId;
  },
  push: function(){
    if(this.navigating) return; // don't re-push while replaying a back/forward step
    var snap = this.snapshot();
    if(this.sameAsCurrent(snap)) return;
    this.stack = this.stack.slice(0, this.index+1);
    this.stack.push(snap);
    this.index = this.stack.length-1;
    this.updateButtons();
  },
  back: function(){
    if(this.index<=0) return;
    this.index--;
    this.applyCurrent();
  },
  forward: function(){
    if(this.index>=this.stack.length-1) return;
    this.index++;
    this.applyCurrent();
  },
  applyCurrent: function(){
    var snap = this.stack[this.index];
    if(!snap) return;
    this.navigating = true;
    state.section = snap.section; state.view = snap.view;
    state.currentDatasetId = snap.currentDatasetId; state.currentDashboardId = snap.currentDashboardId;
    renderAll();
    this.navigating = false;
    this.updateButtons();
  },
  updateButtons: function(){
    var back = document.getElementById('nav-back');
    var fwd = document.getElementById('nav-forward');
    if(back) back.disabled = this.index<=0;
    if(fwd) fwd.disabled = this.index>=this.stack.length-1;
  }
};

function wireSubmenuContent(container, sectionKey){
  Array.prototype.forEach.call(container.querySelectorAll('[data-open-dataset]'), function(btn){ btn.onclick = function(){ openDataset(btn.getAttribute('data-open-dataset')); closeSidebarMobile(); }; });
  Array.prototype.forEach.call(container.querySelectorAll('[data-open-dashboard]'), function(btn){ btn.onclick = function(){ openDashboard(btn.getAttribute('data-open-dashboard')); closeSidebarMobile(); }; });
  var addDs = container.querySelector('[data-add-dataset]'); if(addDs) addDs.onclick = function(){ openUploadModal(); closeSidebarMobile(); };
  var addDash = container.querySelector('[data-add-dashboard]'); if(addDash) addDash.onclick = function(){ newDashboardFlow(); closeSidebarMobile(); };
  Array.prototype.forEach.call(container.querySelectorAll('[data-open-record]'), function(btn){
    btn.onclick = function(){ openSectionRecord(btn.getAttribute('data-open-record'), btn.getAttribute('data-record-id')); closeSidebarMobile(); };

}
function openSectionRecord(sectionKey, recordId){
  openSection(sectionKey);
  var src = SUBMENU_RECORD_SOURCE[sectionKey];
  if(!src) return;
  Records.load(src.table).then(function(records){
    if(state.section!==sectionKey) return;
    var rec = records.filter(function(r){ return r.id===recordId; })[0];
    if(rec){
      if(sectionKey==='documents') return; // documents don't open an edit modal
      openRecordModal(sectionKey, rec);
    }
  });
}
function toggleSubmenu(key){
  state.openSubmenus[key] = !state.openSubmenus[key];

}

    canvas.innerHTML = '<div class="hero"><div class="kicker">DASHBOARDS · ANY DATA</div><h2>Turn a spreadsheet into<br>a dashboard in a minute.</h2><p>Upload a CSV or Excel file, paste rows straight from a spreadsheet, or type data in by hand. Gridwork detects your columns and builds charts you can share.</p>'+heroCta+'</div>';
    if(canEdit()) document.getElementById('hero-add').onclick = openUploadModal;
    return;
  }
  if(state.view==='home' && hasAnyDataset){
    title.textContent = 'Datasets';
    sub.textContent = Object.keys(Store.datasets).length+' dataset(s)';
    if(canEdit()) actions.appendChild(mkBtn('+ Add data', openUploadModal, 'btn-primary'));

  html += '<div class="table-wrap" style="max-height:60vh;"><table class="data-table"><thead><tr>'+cols.map(function(c){ return '<th>'+esc(c.name)+'</th>'; }).join('')+'</tr></thead><tbody>'+sample.map(function(r){ return '<tr>'+cols.map(function(c){ return '<td>'+esc(r[c.name])+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table></div>';

function downloadDatasetCSV(d){
  var rows = Store.getRows(d.id);
  var cols = (d.columns||[]).map(function(c){return c.name;});
  offerDownload(d.name.replace(/[^a-z0-9-_]+/gi,'_')+'.csv', toCSV(cols, rows));
}
function toCSV(cols, rows){
  var lines = [cols.map(csvCell).join(',')];
  rows.forEach(function(r){ lines.push(cols.map(function(c){ return csvCell(r[c]); }).join(',')); });
  return lines.join('\n');
}
function csvCell(v){ v = (v===undefined||v===null) ? '' : String(v); if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"'; return v; }
function offerDownload(filename, data){
  try{
    var blob = new Blob([data], {type:'text/csv'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){ toast('Could not prepare that download.', true); }
}

function wireFilterBar(dashboardId){

  if(!bar) return;
  Array.prototype.forEach.call(bar.querySelectorAll('[data-remove-filter]'), function(btn){

function openFilterModal(dashboardId){
  var datasetIds = {}; (Store.dashboards[dashboardId].cardIds||[]).forEach(function(cid){ var c = Store.cards[cid]; if(c) datasetIds[c.datasetId]=1; });
  var datasets = Object.keys(datasetIds).map(function(id){ return Store.datasets[id]; }).filter(Boolean);
  if(!datasets.length){ toast('Add a chart first.', true); return; }
  var html = '<div class="modal-head"><h3>Add filter</h3><button class="btn btn-ghost btn-icon" id="m-close">✕</button></div><div class="modal-body">'+
    (datasets.length>1 ? '<div class="field"><label>Dataset</label><select id="filter-dataset">'+datasets.map(function(d){return '<option value="'+d.id+'">'+esc(d.name)+'</option>';}).join('')+'</select></div>' : '')+
    '<div class="field"><label>Field</label><select id="filter-field"></select></div>'+
    '<div class="field"><label>Value</label><select id="filter-value"></select></div>'+
    '</div><div class="modal-foot"><span></span><button class="btn btn-primary" id="filter-add">Add filter</button></div>';
  openModal(html, function(modal){
    document.getElementById('m-close').onclick = closeModal;
    var dsSelect = document.getElementById('filter-dataset');
    function currentDataset(){ return dsSelect ? Store.datasets[dsSelect.value] : datasets[0]; }
    function populateFields(){
      var ds = currentDataset();
      var fieldSel = document.getElementById('filter-field');
      fieldSel.innerHTML = (ds.columns||[]).map(function(c){ return '<option value="'+esc(c.name)+'">'+esc(c.name)+'</option>'; }).join('');
      populateValues();
    }
    function populateValues(){
      var ds = currentDataset();
      var field = document.getElementById('filter-field').value;
      var rows = Store.getRows(ds.id);
      var seen = {}; var vals = [];
      for(var i=0;i<rows.length && vals.length<200;i++){
        var v = rows[i][field];
        if(v===undefined||v===null||v==='') continue;
        var key = String(v);
        if(!seen[key]){ seen[key]=1; vals.push(key); }
      }
      vals.sort();
      var valSel = document.getElementById('filter-value');
      valSel.innerHTML = vals.slice(0,200).map(function(v){ return '<option value="'+esc(v)+'">'+esc(v)+'</option>'; }).join('') || '<option value="">No values found</option>';
    }
    if(dsSelect) dsSelect.onchange = populateFields;
    document.getElementById('filter-field').addEventListener('change', populateValues);
    populateFields();
    document.getElementById('filter-add').onclick = function(){
      var ds = currentDataset();
      var field = document.getElementById('filter-field').value;
      var value = document.getElementById('filter-value').value;
      if(!field || value===''){ toast('Pick a field and value.', true); return; }
      dashboardFilters[dashboardId] = dashboardFilters[dashboardId] || [];
      dashboardFilters[dashboardId].push({datasetId:ds.id, field:field, value:value});
      closeModal();
      renderAll();
    };
  });
}

  var datasets = Object.values(Store.datasets);

function wireAskBar(dashboardId){

  function submit(){ askAI(dashboardId); }

function parseJSONLoose(text){
  try{ return JSON.parse(text); }catch(e){}
  var s = text.indexOf('{'); var eIdx = text.lastIndexOf('}');
  if(s>-1 && eIdx>s){ try{ return JSON.parse(text.slice(s,eIdx+1)); }catch(e){} }
  throw new Error('unparseable');
}
async function askAI(dashboardId){
  var note = document.getElementById('ask-note');
  var input = document.getElementById('ask-input');
  var btn = document.getElementById('ask-btn');
  var dsSelect = document.getElementById('ask-dataset');
  var datasets = Object.values(Store.datasets);
  var dsId = dsSelect ? dsSelect.value : (datasets[0] && datasets[0].id);
  var question = input.value.trim();
  if(!question || !dsId) return;
  var ds = Store.datasets[dsId];
  var rows = Store.getRows(dsId);
  var schema = (ds.columns||[]).map(function(c){ return c.name+' ('+c.type+')'; }).join(', ');
  var sampleRows = rows.slice(0,15);
  var prompt = 'You configure a chart for a dashboarding tool.\n'+
    'Dataset "'+ds.name+'" has '+rows.length+' rows. Columns: '+schema+'.\n'+
    'Sample rows as JSON: '+JSON.stringify(sampleRows)+'\n'+
    'User question: "'+question+'"\n'+
    'Reply with ONLY a JSON object, no markdown, in exactly this shape:\n'+
    '{"chartType":"bar|line|pie|scatter|kpi|table","xField":"<exact column name or null>","yField":"<exact column name or null>","agg":"sum|avg|count|min|max","title":"<short title, under 8 words>"}\n'+
    'xField and yField must be chosen from the exact column names listed above (case-sensitive), or null. If the question wants a single overall number, use chartType "kpi" with yField set and xField null.';

  btn.disabled = true; input.disabled = true;
  note.className = 'ask-note'; note.textContent = 'Thinking…';
  try{
    var res = await fetch('/api/ask', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({prompt:prompt})});
    var body = await res.json();
    if(!res.ok){ throw new Error(body.error || 'Request failed'); }
    var spec = parseJSONLoose(body.text);
    var colNames = (ds.columns||[]).map(function(c){return c.name;});
    function matchCol(name){
      if(!name) return null;
      if(colNames.indexOf(name)>-1) return name;
      var lower = String(name).toLowerCase();
      var hit = colNames.filter(function(c){ return c.toLowerCase()===lower; });
      return hit.length ? hit[0] : null;
    }
    var chartType = CHART_TYPES.some(function(t){return t[0]===spec.chartType;}) ? spec.chartType : 'bar';
    var xField = matchCol(spec.xField);
    var yField = matchCol(spec.yField);
    if(!yField){ var numCol = (ds.columns||[]).filter(function(c){return c.type==='number';})[0]; yField = numCol ? numCol.name : colNames[0]; }
    if(chartType!=='kpi' && !xField){ var catCol = (ds.columns||[]).filter(function(c){return c.type!=='number' && c.name!==yField;})[0]; xField = catCol ? catCol.name : colNames[0]; }
    var agg = ['sum','avg','count','min','max'].indexOf(spec.agg)>-1 ? spec.agg : 'sum';
    var slot = nextCardSlot(dashboardId);
    var card = {dashboardId:dashboardId, datasetId:dsId, type:chartType, title:spec.title||question.slice(0,60), xField:xField, yField:yField, agg:agg, posX:slot.posX, posY:slot.posY, width:slot.width, height:slot.height};
    var newId = await Store.saveCard(card);
    card.id = newId; Store.cards[newId] = card;
    note.textContent = ''; input.value = '';
    renderAll();
    setTimeout(function(){ var el = document.getElementById('card-'+newId); if(el) el.scrollIntoView({behavior:'smooth', block:'center'}); }, 60);
  }catch(e){
    note.textContent = 'Couldn\'t work that out — check that your AI setup is complete, or try rephrasing.';
    note.className = 'ask-note err';
  } finally {

/* ================= FREE LAYOUT (drag + resize) ================= */
var MIN_CARD_W = 260, MIN_CARD_H = 200;
function saveCardLayout(card){
  if(!sb) { if(Store.mode==='local' && Store.local.cards[card.id]){ Object.assign(Store.local.cards[card.id], {posX:card.posX, posY:card.posY, width:card.width, height:card.height}); Store.saveLocal(); } return; }
  sb.from('cards').update({pos_x:card.posX, pos_y:card.posY, width:card.width, height:card.height}).eq('id', card.id).then(function(){}, function(){});
}
function nextCardSlot(dashboardId){
  var cardIds = (Store.dashboards[dashboardId] && Store.dashboards[dashboardId].cardIds) || [];
  var maxBottom = 0, any = false;
  cardIds.forEach(function(cid){
    var c = Store.cards[cid];
    if(c){ any = true; var bottom=(c.posY||0)+(c.height||300); if(bottom>maxBottom) maxBottom=bottom; }
  });
  return {posX:0, posY: any ? maxBottom+16 : 0, width:340, height:300};
}
function ensureCardLayout(card, fallbackIndex){
  if(card.width===undefined || card.width===null) card.width = 340;
  if(card.height===undefined || card.height===null) card.height = 300;
  if(card.posX===undefined || card.posX===null || card.posY===undefined || card.posY===null){
    card.posX = (fallbackIndex%2)*360;
    card.posY = Math.floor(fallbackIndex/2)*320;
    saveCardLayout(card);
  }
}
function startDrag(e, el, card){
  if(!canEdit()) return;
  e.preventDefault();
  var startX=e.clientX, startY=e.clientY, startLeft=card.posX||0, startTop=card.posY||0;
  el.style.zIndex = 50;
  function onMove(ev){
    var dx=ev.clientX-startX, dy=ev.clientY-startY;
    var nx=Math.max(0, startLeft+dx), ny=Math.max(0, startTop+dy);
    el.style.left=nx+'px'; el.style.top=ny+'px';
    card._pendingX=nx; card._pendingY=ny;
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    el.style.zIndex='';
    if(card._pendingX!==undefined){ card.posX=card._pendingX; card.posY=card._pendingY; saveCardLayout(card); resizeCanvasContainer(); }
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}
function startResize(e, el, card, corner){
  if(!canEdit()) return;
  e.preventDefault(); e.stopPropagation();
  var startX=e.clientX, startY=e.clientY;
  var startW=card.width||340, startH=card.height||300, startLeft=card.posX||0, startTop=card.posY||0;
  var growsLeft = (corner==='tl'||corner==='bl');
  var growsUp = (corner==='tl'||corner==='tr');
  el.style.zIndex = 50;
  function onMove(ev){
    var dx=ev.clientX-startX, dy=ev.clientY-startY;
    if(growsLeft){ dx = Math.min(dx, startW-MIN_CARD_W); } else { dx = Math.max(dx, MIN_CARD_W-startW); }
    if(growsUp){ dy = Math.min(dy, startH-MIN_CARD_H); } else { dy = Math.max(dy, MIN_CARD_H-startH); }
    var nw = growsLeft ? startW-dx : startW+dx;
    var nh = growsUp ? startH-dy : startH+dy;
    var nx = growsLeft ? startLeft+dx : startLeft;
    var ny = growsUp ? startTop+dy : startTop;
    el.style.width=nw+'px'; el.style.height=nh+'px'; el.style.left=nx+'px'; el.style.top=ny+'px';
    card._pendingW=nw; card._pendingH=nh; card._pendingX=nx; card._pendingY=ny;
    var chart = chartInstances[card.id]; if(chart) chart.resize();
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    el.style.zIndex='';
    if(card._pendingW!==undefined){
      card.width=card._pendingW; card.height=card._pendingH; card.posX=card._pendingX; card.posY=card._pendingY;
      saveCardLayout(card); resizeCanvasContainer();
    }
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}
function makeCardDraggableResizable(el, card){
  var head = el.querySelector('.card-head');
  head.addEventListener('pointerdown', function(e){
    if(e.target.closest('button')) return;
    startDrag(e, el, card);
  });
  ['tl','tr','bl','br'].forEach(function(pos){
    var handle = document.createElement('div');
    handle.className = 'resize-handle '+pos;
    el.appendChild(handle);
    handle.addEventListener('pointerdown', function(e){ startResize(e, el, card, pos); });
  });
}
function resizeCanvasContainer(){
  var canvasWrap = document.getElementById('dash-cards');
  if(!canvasWrap || !canvasWrap.classList.contains('dash-canvas')) return;
  var maxBottom = 40;
  Array.prototype.forEach.call(canvasWrap.children, function(el){
    if(!el.classList || !el.classList.contains('chart-card')) return;
    var bottom = (parseInt(el.style.top)||0) + (parseInt(el.style.height)||300);
    if(bottom>maxBottom) maxBottom = bottom;
  });
  canvasWrap.style.minHeight = (maxBottom+40)+'px';
}

/* ================= X-RAY AUTO DASHBOARD ================= */
async function buildXrayDashboard(datasetId){
  var d = Store.datasets[datasetId];
  var rows = Store.getRows(datasetId);
  var cols = d.columns||[];
  var name = d.name+' overview';
  var dashId = await Store.saveDashboard(name);
  Store.dashboards[dashId] = Store.dashboards[dashId] || {id:dashId, name:name, cardIds:[], createdAt:Date.now()};

  var numCol = cols.filter(function(c){return c.type==='number';})[0];
  var dateCol = cols.filter(function(c){return c.type==='date';})[0];
  var catCols = cols.filter(function(c){return c.type==='string';});
  var catCol = catCols.filter(function(c){ var uniq = {}; rows.forEach(function(r){ uniq[r[c.name]]=1; }); return Object.keys(uniq).length<=20; })[0];

  var toAdd = [];
  toAdd.push({type:'kpi', title:'Total rows', xField:null, yField:cols[0].name, agg:'count', width:300, height:150});
  if(dateCol && numCol){ toAdd.push({type:'line', title:numCol.name+' over time', xField:dateCol.name, yField:numCol.name, agg:'sum', width:700, height:320}); }
  if(catCol && numCol){ toAdd.push({type:'bar', title:numCol.name+' by '+catCol.name, xField:catCol.name, yField:numCol.name, agg:'sum', width:700, height:320}); }
  else if(catCol){ toAdd.push({type:'bar', title:'Count by '+catCol.name, xField:catCol.name, yField:cols[0].name, agg:'count', width:700, height:320}); }

  var runningY = 0;
  for(var i=0;i<toAdd.length;i++){
    var c = toAdd[i]; c.dashboardId = dashId; c.datasetId = datasetId;
    c.posX = 0; c.posY = runningY;
    runningY += c.height + 16;
    var cid = await Store.saveCard(c);
    c.id = cid; Store.cards[cid] = c;
    // Note: Store.saveCard() already appends cid to the dashboard's cardIds
    // (locally and in Supabase) — pushing it again here was the bug.
  }
  state.view='dashboard'; state.currentDashboardId=dashId;
  renderAll();
}

function tagClassFor(value){
  var v = String(value||'').toLowerCase();
  if(/critical|fail|open|ineffective|overdue/.test(v)) return 'tag status-danger';
  if(/high|progress|pending|partially|medium/.test(v)) return 'tag status-warn';
  if(/low|closed|complete|pass|effective|resolved/.test(v)) return 'tag status-ok';
  if(/planned|not tested/.test(v)) return 'tag status-neutral';
  return 'tag status-neutral';
}
function fieldDisplay(value, field){
  if(value===undefined || value===null || value==='') return '—';
  if(field && field.type==='select') return '<span class="'+tagClassFor(value)+'">'+esc(value)+'</span>';
  var s = String(value);
  return esc(s.length>80 ? s.slice(0,80)+'…' : s);
}
async function renderModuleSection(sectionKey, title, sub, actions, canvas){
  var cfg = MODULES[sectionKey];

  canvas.innerHTML = (cfg.description ? '<p class="section-intro">'+esc(cfg.description)+'</p>' : '')+skeletonHTML(5);
  var records = await Records.load(cfg.table);
  if(state.section!==sectionKey) return; // user navigated away while loading
  sub.textContent = records.length+' '+(records.length===1 ? cfg.singular : cfg.label.toLowerCase());
  renderModuleTable(sectionKey, records, canvas);

function statusBarColor(value){
  var cls = tagClassFor(value);
  if(cls.indexOf('status-danger')>-1) return 'var(--danger)';
  if(cls.indexOf('status-warn')>-1) return 'var(--warn)';
  if(cls.indexOf('status-ok')>-1) return 'var(--ok)';
  return 'transparent';
}
function renderModuleTable(sectionKey, records, canvas){
  var cfg = MODULES[sectionKey];
  var intro = cfg.description ? '<p class="section-intro">'+esc(cfg.description)+'</p>' : '';
  if(!records.length){

    (canEdit() ? '<th></th>' : '')+
    '</tr></thead><tbody>';
  records.forEach(function(r){

    html += '<tr style="box-shadow: inset 3px 0 0 '+barColor+';">'+cfg.listFields.map(function(k){ return '<td>'+fieldDisplay(r[k], fieldByKey[k])+'</td>'; }).join('');
    if(canEdit()){
      html += '<td><button class="btn btn-ghost btn-sm" data-edit-record="'+r.id+'">Edit</button> <button class="btn btn-ghost btn-sm" data-delete-record="'+r.id+'">Delete</button></td>';
    }

  Array.prototype.forEach.call(canvas.querySelectorAll('[data-edit-record]'), function(btn){

          renderAll();
        }).catch(function(){ toast('Could not delete that '+cfg.singular.toLowerCase()+' — try again.', true); });
      }, {danger:true, confirmLabel:'Delete '+cfg.singular.toLowerCase()});
    };

async function openRecordModal(sectionKey, existing){
  var cfg = MODULES[sectionKey];
  // Pre-load options for any relation fields before building the form.
  var relationOptions = {};
  for(var i=0;i<cfg.fields.length;i++){
    var f = cfg.fields[i];
    if(f.type==='relation'){
      var relCfg = MODULES[f.relatedModule];
      var opts = await Records.load(relCfg.table);
      relationOptions[f.key] = opts;
    }
  }
  var html = '<div class="modal-head"><h3>'+(existing?'Edit ':'Add ')+esc(cfg.singular)+'</h3><button class="btn btn-ghost btn-icon" id="m-close">✕</button></div><div class="modal-body">';
  cfg.fields.forEach(function(f){
    var val = existing ? (existing[f.key]!==undefined && existing[f.key]!==null ? existing[f.key] : '') : (f.default||'');
    html += '<div class="field"><label>'+esc(f.label)+(f.required?' *':'')+'</label>';
    if(f.type==='textarea'){
      html += '<textarea data-field="'+f.key+'">'+esc(val)+'</textarea>';
    } else if(f.type==='select'){
      html += '<select data-field="'+f.key+'">'+f.options.map(function(o){ return '<option value="'+esc(o)+'"'+(o===val?' selected':'')+'>'+esc(o)+'</option>'; }).join('')+'</select>';
    } else if(f.type==='relation'){
      var relCfg = MODULES[f.relatedModule];
      var opts2 = relationOptions[f.key] || [];
      html += '<select data-field="'+f.key+'"><option value="">— None —</option>'+
        opts2.map(function(o){ var lbl = String(o[f.relatedLabel]||'').slice(0,60); return '<option value="'+o.id+'"'+(o.id===val?' selected':'')+'>'+esc(lbl)+'</option>'; }).join('')+
        '</select>';
    } else if(f.type==='date'){
      html += '<input type="date" data-field="'+f.key+'" value="'+esc(val)+'" />';
    } else if(f.type==='number'){
      html += '<input type="number" data-field="'+f.key+'" value="'+esc(val)+'" />';
    } else {
      html += '<input type="text" data-field="'+f.key+'" value="'+esc(val)+'" />';
    }
    html += '</div>';
  });
  html += '</div><div class="modal-foot"><span></span><button class="btn btn-primary" id="record-save">Save</button></div>';
  openModal(html, function(modal){
    document.getElementById('m-close').onclick = closeModal;
    document.getElementById('record-save').onclick = async function(){
      var values = {};
      var missing = false;
      cfg.fields.forEach(function(f){
        var el = modal.querySelector('[data-field="'+f.key+'"]');
        var v = el ? el.value : '';
        if(f.required && !v){ missing = true; }
        values[f.key] = (f.type==='number' && v!=='') ? Number(v) : v;
      });
      if(missing){ toast('Fill in the required field(s).', true); return; }
      var btn = document.getElementById('record-save');
      btn.disabled = true; btn.textContent = 'Saving…';
      try{
        await Records.save(cfg.table, values, existing ? existing.id : null);
        closeModal();
        toast(cfg.singular+' saved.');
        logActivity(existing?'updated':'created', cfg.singular.toLowerCase(), values[cfg.listFields[0]]);
        renderAll();
      }catch(e){
        btn.disabled = false; btn.textContent = 'Save';
        toast('Could not save. Check required fields.', true);
      }
    };
  });
}

async function downloadDocument(doc){
  if(!doc || !sb) return;
  try{
    var res = await sb.storage.from('documents').createSignedUrl(doc.file_path, 60);
    if(res.error) throw res.error;
    window.open(res.data.signedUrl, '_blank');
  }catch(e){ toast('Could not open that file.', true); }
}
function deleteDocumentConfirm(doc){
  if(!doc) return;
  confirmModal('Delete "'+doc.title+'"? This can\'t be undone.', function(){
    (async function(){
      try{
        await sb.storage.from('documents').remove([doc.file_path]);
        await Records.remove('documents', doc.id);
        toast('Document deleted.');
        logActivity('deleted', 'document', doc.title);
        renderAll();
      }catch(e){ toast('Could not delete that document — try again.', true); }
    })();
  }, {danger:true, confirmLabel:'Delete document'});
}
function openDocUploadModal(){
  var html = '<div class="modal-head"><h3>Upload document</h3><button class="btn btn-ghost btn-icon" id="m-close">✕</button></div><div class="modal-body">'+
    '<div class="field"><label>Title</label><input type="text" id="doc-title" placeholder="e.g. Q3 Travel Policy" /></div>'+
    '<div class="field"><label>File</label><input type="file" id="doc-file" /></div>'+
    '</div><div class="modal-foot"><span></span><button class="btn btn-primary" id="doc-save" disabled>Upload</button></div>';
  openModal(html, function(modal){
    document.getElementById('m-close').onclick = closeModal;
    var fileInput = document.getElementById('doc-file');
    var titleInput = document.getElementById('doc-title');
    fileInput.onchange = function(){
      if(fileInput.files[0] && !titleInput.value){ titleInput.value = fileInput.files[0].name.replace(/\.[^.]+$/,''); }
      document.getElementById('doc-save').disabled = !fileInput.files[0];
    };
    document.getElementById('doc-save').onclick = async function(){
      var file = fileInput.files[0];
      if(!file) return;
      var btn = document.getElementById('doc-save');
      btn.disabled = true; btn.textContent = 'Uploading…';
      try{
        var path = uid()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
        var up = await sb.storage.from('documents').upload(path, file);
        if(up.error) throw up.error;
        var docTitle = titleInput.value.trim()||file.name;
        var payload = { title: docTitle, file_name:file.name, file_path:path, file_size:file.size, content_type:file.type };
        if(Auth.user) payload.created_by = Auth.user.id;
        var ins = await sb.from('documents').insert(payload);
        if(ins.error) throw ins.error;
        closeModal();
        toast('Document uploaded.');
        logActivity('uploaded', 'document', docTitle);
        renderAll();
      }catch(e){
        btn.disabled = false; btn.textContent = 'Upload';
        toast('Could not upload that file.', true);
      }
    };
  });
}

/* ================= AUDIT TRAIL ================= */
function timeAgo(iso){
  var d = new Date(iso);
  var diff = (Date.now() - d.getTime())/1000;
  if(diff < 60) return 'just now';
  if(diff < 3600) return Math.floor(diff/60)+'m ago';
  if(diff < 86400) return Math.floor(diff/3600)+'h ago';
  if(diff < 604800) return Math.floor(diff/86400)+'d ago';
  return d.toLocaleDateString();
}
function actionVerb(a){
  if(a==='created') return 'created';
  if(a==='updated') return 'updated';
  if(a==='deleted') return 'deleted';
  if(a==='uploaded') return 'uploaded';
  return a;
}
