      if(v==='system'){ document.documentElement.removeAttribute('data-theme'); }
      else { document.documentElement.setAttribute('data-theme', v); }
      Object.keys(chartInstances).forEach(function(id){ destroyChart(id); });
      renderAll();
      toast('Default theme updated.');
    };
  }
}

/* ================= CHANGE PASSWORD ================= */
function openChangePasswordModal(){
  var html = '<div class="modal-head"><h3>Change password</h3><button class="btn btn-ghost btn-icon" id="m-close">✕</button></div>'+
    '<div class="modal-body">'+
    '<div class="field"><label>New password</label><input type="password" id="cp-new" autocomplete="new-password" /></div>'+
    '<div class="field"><label>Confirm new password</label><input type="password" id="cp-confirm" autocomplete="new-password" /></div>'+
    '<div class="ask-note" id="cp-note"></div>'+
    '</div>'+
    '<div class="modal-foot"><span></span><button class="btn btn-primary" id="cp-submit">Update password</button></div>';
  openModal(html, function(modal){
    document.getElementById('m-close').onclick = closeModal;
    document.getElementById('cp-submit').onclick = async function(){
      var p1 = document.getElementById('cp-new').value;
      var p2 = document.getElementById('cp-confirm').value;
      var note = document.getElementById('cp-note');
      if(!p1 || p1.length<6){ note.className='ask-note err'; note.textContent='Use at least 6 characters.'; return; }
      if(p1!==p2){ note.className='ask-note err'; note.textContent="Passwords don't match."; return; }
      var btn = document.getElementById('cp-submit');
      btn.disabled = true; note.className='ask-note'; note.textContent='Updating…';
      try{
        var res = await sb.auth.updateUser({ password: p1 });
        if(res.error) throw res.error;
        toast('Password updated.');
        closeModal();
      }catch(e){
        note.className='ask-note err'; note.textContent = (e && e.message) || 'Could not update password.';
        btn.disabled = false;
      }
    };
  });
}

/* ================= TEAM MANAGEMENT ================= */
function openTeamModal(){
  var html = '<div class="modal-head"><h3>Manage team</h3><button class="btn btn-ghost btn-icon" id="m-close">✕</button></div><div class="modal-body" id="team-body">'+skeletonHTML(3)+'</div><div class="modal-foot"><span style="font-size:12px;color:var(--ink-faint);">Only editors can change roles.</span><span></span></div>';
  openModal(html, function(modal){
    document.getElementById('m-close').onclick = closeModal;
    loadTeamList();
  });
}
async function loadTeamList(){
  var body = document.getElementById('team-body');
  if(!body || !sb) return;
  try{
    var res = await sb.from('profiles').select('*').order('created_at', {ascending:true});
    if(res.error) throw res.error;
    var rows = res.data || [];
    body.innerHTML = rows.map(function(p){
      var isMe = Auth.user && p.id===Auth.user.id;
      return '<div class="team-row"><div class="who">'+esc(p.full_name||p.email||'Unknown')+(isMe?' (you)':'')+'<span class="email">'+esc(p.email||'')+'</span></div>'+
        '<select data-role-for="'+p.id+'" '+(isMe?'disabled':'')+' style="width:auto;min-height:32px;padding:4px 24px 4px 8px;font-size:12.5px;">'+
        '<option value="viewer"'+(p.role==='viewer'?' selected':'')+'>Viewer</option>'+
        '<option value="editor"'+(p.role==='editor'?' selected':'')+'>Editor</option>'+
        '</select></div>';
    }).join('') || '<div style="color:var(--ink-faint);font-size:13px;">No team members yet.</div>';
    Array.prototype.forEach.call(body.querySelectorAll('[data-role-for]'), function(sel){
      sel.onchange = async function(){
        var uid2 = sel.getAttribute('data-role-for');
        try{
          var r = await sb.from('profiles').update({role:sel.value}).eq('id', uid2);
          if(r.error) throw r.error;
          toast('Role updated.');
        }catch(e){ toast('Could not update role.', true); }
      };
    });
  }catch(e){ body.innerHTML = '<div style="color:var(--danger);font-size:13px;">Could not load the team list.</div>'; }
}

/* ================= LOGIN SCREEN ================= */
var loginMode = 'signin';
function setLoginMode(mode){
  loginMode = mode;
  document.getElementById('login-title').textContent = mode==='signin' ? 'Sign in' : 'Create your account';
  document.getElementById('login-sub').textContent = mode==='signin' ? 'Use your team account to continue.' : 'The first person to sign up becomes an editor automatically.';
  document.getElementById('login-name-field').style.display = mode==='signup' ? '' : 'none';
  document.getElementById('login-submit').textContent = mode==='signin' ? 'Sign in' : 'Sign up';
  document.getElementById('login-toggle-text').textContent = mode==='signin' ? "Don't have an account?" : 'Already have an account?';
  document.getElementById('login-toggle').textContent = mode==='signin' ? 'Sign up' : 'Sign in';
  document.getElementById('login-note').textContent = '';
}
function wireLoginScreen(){
  document.getElementById('login-toggle').onclick = function(){ setLoginMode(loginMode==='signin' ? 'signup' : 'signin'); };
  document.getElementById('login-submit').onclick = async function(){
    var email = document.getElementById('login-email').value.trim();
    var password = document.getElementById('login-password').value;
    var name = document.getElementById('login-name').value.trim();
    var note = document.getElementById('login-note');
    var btn = document.getElementById('login-submit');
    if(!email || !password){ note.textContent = 'Enter an email and password.'; note.className='ask-note err'; return; }
    btn.disabled = true; note.className='ask-note'; note.textContent = 'Working…';
    try{
      if(loginMode==='signup'){
        await Auth.signUp(email, password, name);
        note.textContent = 'Account created. If email confirmation is on for your project, check your inbox — otherwise you can sign in now.';
        note.className = 'ask-note';
        setLoginMode('signin');
        btn.disabled = false;
      } else {
        await Auth.signIn(email, password);
        location.reload();
      }
    }catch(e){
      note.className = 'ask-note err';
      note.textContent = (e && e.message) || 'Something went wrong.';
      btn.disabled = false;
    }
  };
}
function showLoginScreen(){
  document.getElementById('login-screen').classList.add('show');
  document.getElementById('app').style.display = 'none';
  wireLoginScreen();
  setLoginMode('signin');
}
function hideLoginScreen(){
  document.getElementById('login-screen').classList.remove('show');
  document.getElementById('app').style.display = '';
}

/* ================= GLOBAL SEARCH ================= */
var GlobalSearch = {
  allTablesLoading: null,
  ensureLoaded: function(){
    if(!sb) return Promise.resolve();
    if(this.allTablesLoading) return this.allTablesLoading;
    var tables = Object.keys(MODULES).map(function(k){ return MODULES[k].table; }).concat(['documents']);
    this.allTablesLoading = Promise.all(tables.map(function(t){ return Records.cache[t] ? null : Records.load(t); }));
    return this.allTablesLoading;
  },
  run: function(query){
    query = (query||'').trim().toLowerCase();
    var results = { datasets:[], dashboards:[], modules:[], documents:[] };
    if(!query) return results;
    Object.values(Store.datasets).forEach(function(d){ if((d.name||'').toLowerCase().indexOf(query)>-1) results.datasets.push(d); });
    Object.values(Store.dashboards).forEach(function(d){ if((d.name||'').toLowerCase().indexOf(query)>-1) results.dashboards.push(d); });
    Object.keys(MODULES).forEach(function(key){
      var cfg = MODULES[key];
      var records = Records.cache[cfg.table] || [];
      records.forEach(function(r){
        var hay = cfg.listFields.map(function(f){ return String(r[f]||''); }).join(' ').toLowerCase();
        if(hay.indexOf(query)>-1) results.modules.push({sectionKey:key, cfg:cfg, record:r});
      });
    });
    (Records.cache['documents']||[]).forEach(function(d){
      var hay = ((d.title||'')+' '+(d.file_name||'')).toLowerCase();
      if(hay.indexOf(query)>-1) results.documents.push(d);
    });
    return results;
  }
};
function renderSearchResults(results){
  var el = document.getElementById('gsearch-results');
  var total = results.datasets.length+results.dashboards.length+results.modules.length+results.documents.length;
  if(total===0){ el.innerHTML = '<div class="gsearch-empty">No matches. Try a different search term.</div>'; el.classList.add('open'); return; }
  var html = '';
  if(results.datasets.length){
    html += '<div class="gsearch-group-label">Datasets</div>';
    results.datasets.slice(0,5).forEach(function(d){ html += '<button class="gsearch-item" data-go="dataset" data-id="'+d.id+'">'+esc(d.name)+'<span class="gtype">dataset</span></button>'; });
  }
  if(results.dashboards.length){
    html += '<div class="gsearch-group-label">Dashboards</div>';
    results.dashboards.slice(0,5).forEach(function(d){ html += '<button class="gsearch-item" data-go="dashboard" data-id="'+d.id+'">'+esc(d.name)+'<span class="gtype">dashboard</span></button>'; });
  }
  if(results.modules.length){
    html += '<div class="gsearch-group-label">Records</div>';
    results.modules.slice(0,8).forEach(function(m){
      var label = m.record[m.cfg.listFields[0]] || 'Untitled';
      html += '<button class="gsearch-item" data-go="record" data-section="'+m.sectionKey+'" data-id="'+m.record.id+'">'+esc(label)+'<span class="gtype">'+esc(m.cfg.singular)+'</span></button>';
    });
  }
  if(results.documents.length){
    html += '<div class="gsearch-group-label">Documents</div>';
    results.documents.slice(0,5).forEach(function(d){ html += '<button class="gsearch-item" data-go="document" data-id="'+d.id+'">'+esc(d.title||d.file_name||'Untitled')+'<span class="gtype">document</span></button>'; });
  }
  el.innerHTML = html;
  el.classList.add('open');
  Array.prototype.forEach.call(el.querySelectorAll('[data-go]'), function(btn){
    btn.onclick = function(){
      var go = btn.getAttribute('data-go');
      if(go==='dataset') openDataset(btn.getAttribute('data-id'));
      else if(go==='dashboard') openDashboard(btn.getAttribute('data-id'));
      else if(go==='record') openSectionRecord(btn.getAttribute('data-section'), btn.getAttribute('data-id'));
      else if(go==='document') openSection('documents');
      closeSearchResults();
      document.getElementById('gsearch-input').value = '';
      closeSidebarMobile();
    };
  });
}
function closeSearchResults(){ var el = document.getElementById('gsearch-results'); if(el){ el.classList.remove('open'); el.innerHTML=''; } }

  Object.keys(chartInstances).forEach(function(id){ destroyChart(id); });
  renderAll();
};
document.getElementById('profile-btn').onclick = function(ev){
  ev.stopPropagation();
  document.getElementById('profile-dropdown').classList.toggle('open');
};

  var dd = document.getElementById('profile-dropdown');
  if(dd && dd.classList.contains('open') && !ev.target.closest('.profile-menu-wrap')){ dd.classList.remove('open'); }

var gsInput = document.getElementById('gsearch-input');
var gsDebounce = null;
gsInput.addEventListener('focus', function(){ GlobalSearch.ensureLoaded().then(function(){ if(gsInput.value.trim()) renderSearchResults(GlobalSearch.run(gsInput.value)); }); });
gsInput.addEventListener('input', function(){
  clearTimeout(gsDebounce);
  var q = gsInput.value;
  if(!q.trim()){ closeSearchResults(); return; }
  gsDebounce = setTimeout(function(){
    GlobalSearch.ensureLoaded().then(function(){ renderSearchResults(GlobalSearch.run(q)); });
  }, 120);
});
gsInput.addEventListener('keydown', function(ev){
  if(ev.key==='Escape'){ closeSearchResults(); gsInput.blur(); }
  if(ev.key==='Enter'){
    var first = document.querySelector('#gsearch-results .gsearch-item');
    if(first) first.click();
  }
});
document.addEventListener('keydown', function(ev){
  if(ev.key==='/' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA' && !document.getElementById('modal-root').innerHTML){
    ev.preventDefault(); gsInput.focus();
  }
});

/* ================= BOOT ================= */
function applyStoredThemeDefault(){
  var stored = localStorage.getItem('gw_theme_default');
  if(stored==='light' || stored==='dark'){ document.documentElement.setAttribute('data-theme', stored); }
}
async function boot(){
  applyStoredThemeDefault();
  applySidebarCollapsed();
  showSetupBanner();
  if(sb){
    await Auth.init();
    if(!Auth.user){ showLoginScreen(); return; }
  }
  hideLoginScreen();
  await Store.init();
  renderAll();
}
boot();
})();
